en:
  site_settings:
    nextcloud_office_enabled: "Enable the Nextcloud Office integration. Configure the connection before enabling it."
    nextcloud_office_base_url: "HTTPS base URL of the Nextcloud instance, for example https://cloud.example.com. No path, query or credentials."
    nextcloud_office_username: "Nextcloud service account used by the plugin to create files and shares."
    nextcloud_office_app_password: "App password of the Nextcloud service account. Only stored and used on the server; rotating it invalidates the old value immediately."
    nextcloud_office_folder: "Target folder for created documents, relative to the service account's files (for example: Community/Discourse)."
    nextcloud_office_max_file_size_mb: "Largest Office file the plugin accepts in megabytes. The effective limit never exceeds the site's maximum attachment size."
  nextcloud_office:
    errors:
      not_logged_in: "You need to sign in to create or check office documents."
      account_inactive: "Your account cannot use the office integration. Contact an administrator."
      session_required: "This request must come from a signed-in browser session, not from an API key."
      not_configured: "The Nextcloud Office integration is not fully configured yet. Contact an administrator."
      operation_not_found: "No office operation was found for this key."
      csrf_failed: "The security token is missing or expired. Reload the page and try again."
      invalid_parameters: "The request contains invalid parameters."
      invalid_file_name: "The file name is invalid."
      invalid_operation_key: "The operation key is invalid."
      unsupported_file_type: "This file type is not supported."
      invalid_file_content: "The file content does not match the declared Office format."
      file_extension_mismatch: "The file extension does not match the selected file type."
      invalid_share_password: "The share password is invalid."
      request_too_large: "The request is larger than the office integration allows."
      file_too_large: "The file exceeds the maximum size allowed for office documents."
      file_type_not_allowed: "This file type is not allowed on this site, so it cannot be transferred to Nextcloud."
      rate_limited: "Too many office requests. Wait a moment and try again."
      too_many_concurrent: "Another office operation is still running. Wait a moment and try again."
      generic: "The office request could not be completed."
      operation_conflict: "This operation conflicts with an existing request. Do not create a new request; contact an administrator."
      operation_unknown: "The office operation is not yet confirmed. Retry the same request to check its outcome."
      operation_failed: "This office operation could not be completed. Contact an administrator."
      operation_unavailable: "This office result cannot be read. Contact an administrator."
